hypotheses:
  H_attempt_scope: >-
    Isolating evidence, commands, and witnesses by active command attempt prevents
    stale/cross-attempt evidence from producing current-attempt verification while
    preserving recognition of effects that are physically true.
  H_support_proof: >-
    Discharge-aware disjunctive support clauses prevent both over-invalidation after
    legitimate discharge/alternative support and under-invalidation while support is live.
  H_truth_attribution: >-
    Separating physical effect truth from active-attempt credit permits correct task
    advance after incidental realization without falsely crediting the current skill.

