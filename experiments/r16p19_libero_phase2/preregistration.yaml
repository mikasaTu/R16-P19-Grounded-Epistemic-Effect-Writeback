scientific_question: >-
  Under one competent deterministic executor whose inputs are independent of
  memory state and fault identity, does the frozen R16-P19 B6 memory mechanism
  causally improve faulted LIBERO behavior over B3 and B5 without harming clean
  execution?

evidence_boundary:
  goal: >-
    Replace the inadequate learned Phase-1B actor with exactly one
    preregistered RetargetedGeometricSkillExecutor, qualify it on untouched
    init 60..79, view formal init 0..19 only after the executor is frozen, and
    run the original 800-cell oracle-receipt matrix only if both competence
    gates pass.
  excluded:
    - a third neural BC, ACT, or VLA actor
    - a second executor family
    - visual policy or publication-level performance claims
    - changes to memory, ontology, receipts, fault meanings, behavior gates, or bootstrap
    - post-qualification or post-formal executor tuning
    - formal activation, encryption, or excessive integrity infrastructure

