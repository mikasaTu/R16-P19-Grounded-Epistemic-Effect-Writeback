development_protocol:
  allowed_data:
    - successful effect segments from demo 0..29 for deterministic template extraction
    - demo 30..39 for controller calibration only
    - init 40..59 for executor development, debugging, and mechanism ablations
  fixed_component_ablation_order:
    - world_frame_open_loop_template
    - add_effect_local_frame_retargeting
    - add_closed_loop_cartesian_tracking
    - add_receding_horizon_and_preregistered_retry_offsets
  ablation_role: mechanism_diagnosis_only_not_executor_family_selection
  comparison_unit: paired_task_and_init_index_on_init_40..59
  reverse_explanation_policy: >-
    Attribute any increase or decrease only after a one-factor paired ablation,
    trace-level geometric diagnostics, and failure-component mediation. Label
    unsupported accounts as hypotheses; do not generate a new research idea.

