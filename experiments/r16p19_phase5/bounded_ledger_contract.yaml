  audit_chain_breaks: 0
  event_latency_p99_ms_max: 1.0
  tick_latency_p99_ms_max: 2.0
  ledger_fraction_policy_cycle_max: 0.05
  p99_100k_over_1k_max: 1.2
  hot_memory_mb_max: 10.0
