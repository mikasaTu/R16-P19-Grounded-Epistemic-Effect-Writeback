schema_version: 1
implementations: [live_bounded, unbounded_reference]
hot_capacities:
  recent_closed_per_effect: 4
  recent_effects_per_attempt: 4
  receipts_per_source: 4
  active_attempts: 4
  active_proofs_per_effect: 4
  support_clauses_total: 256
cold_audit: append_only_compacted_summary
receipt_fields: [receipt_id, attempt_id, command_id, effect_id, source_id, source_version, observed_at, expires_at, payload_hash, confidence, truth_value, active_attempt_credit, capture_id, sensor_source, source_group, correlation_group, frame_digest, timestamp, verifier_model_version, calibration_version, parent_ids, realization_kind]
