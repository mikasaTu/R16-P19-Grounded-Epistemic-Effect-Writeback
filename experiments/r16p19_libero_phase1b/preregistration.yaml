actor_memory_decoupling:
  required_interface: SkillActor.action_chunk(state_history, task_id, effect_id, execution_mode)
  execution_modes: [EXECUTE, RETRY]
  actor_allowed_inputs:
    - four most recent padded simulator states
    - task identity
    - effect identity
    - execution mode
  actor_forbidden_inputs:
    - memory summary
    - epistemic state
    - simulator effect truth
    - future state
    - reward or task success
    - camera privileged labels
  memory_decisions:
    ADVANCE_TO_NEXT_SUBTASK: switch_to_next_effect_skill
    RETRY_CURRENT_EFFECT: execute_current_effect_with_RETRY
    REOBSERVE: fixed_arm_independent_eight_step_noop_observation
    ROLLBACK_OR_REPLAN: reset_actor_history_and_execute_current_effect_with_RETRY
    SAFE_STOP: terminate_episode
  paired_prefix_invariant: >-
    Before the first high-level decision divergence, actor input hashes and
    action bytes must be identical for B2, B3, B5, and B6.

