evidence_boundary:
  goal: >-
    Qualify one small memory-independent actor and, only if it passes the
    frozen actor gate, evaluate the frozen R16-P19 memory mechanism in the
    preregistered 800-rollout closed-loop matrix.
  excluded:
    - Pi0.5
    - DINO-WM
    - visual ACT
    - large VLA
    - Mem-0
    - a third actor family
    - modification of memory semantics or behavior thresholds

